function evaluate(t){let vague=(t.match(/なんでも|特にない|どっちでも|別に|普通|大丈夫|わからない/g)||[]).length,reason=/(なぜ|理由|だから|ので|ため|と思う|感じる)/.test(t),concrete=/(例えば|たとえば|実際|経験|最近|以前|具体的)/.test(t),boundary=/(ただ|でも|まで|なら|場合|難しい|避けたい|大事)/.test(t),s=0;s+=t.length>=20?25:0;s+=t.length>=50?15:0;s+=reason?20:0;s+=concrete?20:0;s+=boundary?20:0;if(vague>=2)s-=20;s=Math.max(0,Math.min(100,s));let title,text,point;if(s>=75){title="◎ 人柄がかなり見える回答";text="理由・具体性・自分なりの基準が入っていて、判断の仕方を想像しやすい。";point="長く話す必要はありません。「自分の考え＋理由または具体例」が入っていれば十分です。"}else if(vague>=2){title="△ 寛容さが強く出すぎています";text="柔軟なのは長所ですが、何でも許容すると何を大事にする人なのか見えにくくなります。";point="「基本は大丈夫。ただし○○は大事にしたい」のように境界線を1つ示しましょう。"}else if(s>=50){title="○ 伝わっています。もう一歩";text="答えは成立しています。あと一つ「なぜ？」「どこまで？」「実際には？」を足すと人柄が出ます。";point="正解っぽくまとめるより、自分の判断基準を1個出すのがコツです。"}else{title="△ 情報が少なめ";text="回答は間違いではありませんが、面接官からすると人柄を判断する材料が少ない状態です。";point="理由か具体的な経験を一つだけ追加してください。"}return{s,title,text,point}}
$("submit").onclick=()=>{let t=$("answer").value.trim();if(!t)return;let e=evaluate(t);answers.push({a:t,e:e});$("title").textContent=e.title;$("judge").textContent=e.text;$("good").textContent=GOOD[Math.random()*GOOD.length|0];$("weak").textContent=WEAK[Math.random()*WEAK.length|0];$("bad").textContent=BAD[Math.random()*BAD.length|0];$("point").textContent=e.point;$("feedback").classList.remove("hidden");$("submit").disabled=true}
